[project]
name = "teleop"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "crcmod",
    "matplotlib>=3.10.9",
    "mcap>=1.3.1",
    "numpy>=1.26,<2",
    "opencv-python",
    "pygame",
    "pycapnp==2.1.0",
    "pycryptodome",
    "pygobject",
    "pyyaml>=6.0.3",
    "pyzmq",
    "rerun-sdk==0.22.1",
    "scons",
    "tqdm",
    "libusb1>=3.4.0",
    "inputs>=0.5",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pytest",
]
reconstruction = [
    "astor==0.8.1 ; python_version < '3.12'",
    "bitsandbytes==0.43.0 ; python_version < '3.12'",
    "easydict==1.13 ; python_version < '3.12'",
    "einops-exts==0.0.4 ; python_version < '3.12'",
    "flash-attn==2.8.3 ; python_version < '3.12'",
    "gsplat @ git+https://github.com/nerfstudio-project/gsplat.git@2323de5905d5e90e035f792fe65bad0fedd413e7 ; python_version < '3.12'",
    "huggingface-hub[cli]<1.0 ; python_version < '3.12'",
    "hydra-core==1.3.2 ; python_version < '3.12'",
    "igraph==0.11.8 ; python_version < '3.12'",
    "kaolin @ https://nvidia-kaolin.s3.us-east-2.amazonaws.com/torch-2.8.0_cu128/kaolin-0.18.0-cp311-cp311-linux_x86_64.whl ; python_version < '3.12'",
    "lightning==2.3.3 ; python_version < '3.12'",
    "loguru==0.7.2 ; python_version < '3.12'",
    "moge @ git+https://github.com/microsoft/MoGe.git@a8c37341bc0325ca99b9d57981cc3bb2bd3e255b ; python_version < '3.12'",
    "nvidia-cuda-nvcc-cu12==12.8.93 ; python_version < '3.12'",
    "ninja ; python_version < '3.12'",
    "omegaconf==2.3.0 ; python_version < '3.12'",
    "open3d==0.18.0 ; python_version < '3.12'",
    "optree==0.14.1 ; python_version < '3.12'",
    "point-cloud-utils==0.29.5 ; python_version < '3.12'",
    "pycocotools==2.0.7 ; python_version < '3.12'",
    "pymeshfix==0.17.0 ; python_version < '3.12'",
    "pytorch3d @ git+https://github.com/facebookresearch/pytorch3d.git@75ebeeaea0908c5527e7b1e305fbc7681382db47 ; python_version < '3.12'",
    "roma==1.5.1 ; python_version < '3.12'",
    "sam3 @ git+https://github.com/facebookresearch/sam3.git@6dbb02bd38288df755dfa1378000a861e65b84f6 ; python_version < '3.12'",
    "safetensors ; python_version < '3.12'",
    "scikit-image==0.23.1 ; python_version < '3.12'",
    "setuptools==80.9.0 ; python_version < '3.12'",
    "spconv-cu121==2.3.8 ; python_version < '3.12'",
    "timm>=1.0.17 ; python_version < '3.12'",
    "torch==2.8.0 ; python_version < '3.12'",
    "torchvision==0.23.0 ; python_version < '3.12'",
    "trimesh>=4.4 ; python_version < '3.12'",
    "wheel==0.47.0 ; python_version < '3.12'",
    "xatlas==0.0.9 ; python_version < '3.12'",
    "xformers==0.0.32.post2 ; python_version < '3.12'",
]

[tool.uv]
default-groups = ["dev"]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
no-build-isolation-package = [
    "flash-attn",
    "gsplat",
    "pytorch3d",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.3"
requires-dist = ["einops", "torch"]

[[tool.uv.dependency-metadata]]
name = "pytorch3d"
version = "0.7.8"
requires-dist = ["iopath"]

[[tool.uv.dependency-metadata]]
name = "gsplat"
version = "1.5.3"
requires-dist = ["ninja", "numpy", "rich>=12", "torch"]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
testpaths = [
    "tests",
]
